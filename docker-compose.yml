services:
  ec-project-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ec-project-backend
    ports:
      - "8080:8080"
    environment:
      - ENV=prod
      - POSTGRES_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@ec-project-postgres:5432/ec_project
      - MONGO_HOST=ec-project-mongo
      - MONGO_PORT=27017
      - MONGO_DB=ec_project
      - CHROMA_HOST=ec-project-chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ec-project-ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - SESSION_SECRET=${SESSION_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
    depends_on:
      ec-project-postgres:
        condition: service_healthy
      ec-project-mongo:
        condition: service_started
      ec-project-chroma:
        condition: service_started
      ec-project-ollama:
        condition: service_started

  ec-project-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: ec-project-frontend
    ports:
      - "5173:80"
    depends_on:
      - ec-project-backend

  ec-project-postgres:
    image: postgres:16-alpine
    container_name: ec-project-postgres
    environment:
      - POSTGRES_DB=ec_project
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ec_project_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ec_project"]
      interval: 5s
      timeout: 3s
      retries: 20

  ec-project-mongo:
    image: mongo:7
    container_name: ec-project-mongo
    ports:
      - "27017:27017"
    volumes:
      - ec_project_mongodata:/data/db

  ec-project-chroma:
    image: chromadb/chroma:latest
    container_name: ec-project-chroma
    ports:
      - "8000:8000"
    volumes:
      - ec_project_chromadata:/chroma/chroma

  ec-project-ollama:
    image: ollama/ollama:latest
    container_name: ec-project-ollama
    ports:
      - "11434:11434"
    volumes:
      - ec_project_ollamadata:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  ec-project-tests:
    build:
      context: .
      dockerfile: data_pipeline/Dockerfile
    container_name: ec-project-tests
    volumes:
      - ./data_pipeline:/app/data_pipeline
    depends_on:
      ec-project-postgres:
        condition: service_healthy
      ec-project-mongo:
        condition: service_started
      ec-project-chroma:
        condition: service_started
    environment:
      - POSTGRES_URL=postgresql://${DB_USER}:${DB_PASSWORD}@ec-project-postgres:5432/ec_project
      - MONGO_HOST=ec-project-mongo
      - MONGO_PORT=27017
      - MONGO_DB=ec_project
      - CHROMA_HOST=ec-project-chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ec-project-ollama:11434
    env_file:
      - .env

  ec-project-backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: ec-project-backend-tests
    volumes:
      - ./backend:/app/backend
    depends_on:
      ec-project-postgres:
        condition: service_healthy
      ec-project-mongo:
        condition: service_started
      ec-project-chroma:
        condition: service_started
      ec-project-ollama:
        condition: service_started
    environment:
      - POSTGRES_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@ec-project-postgres:5432/ec_project
      - MONGO_HOST=ec-project-mongo
      - MONGO_PORT=27017
      - MONGO_DB=ec_project
      - CHROMA_HOST=ec-project-chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ec-project-ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
    tty: true
  
  ec-project-prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: ec-project-prefect-server
    environment:
      - PREFECT_UI_API_URL=http://localhost:4200/api
    ports:
      - "4200:4200"
    volumes:
      - ./flows:/flows:ro
    command: ["bash", "-lc", "prefect server start --host 0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:4200/api/health').status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      - ec-project-postgres
      - ec-project-mongo

  ec-project-prefect-worker:
    build:
      context: ./flows
      dockerfile: Dockerfile
    image: ec-project-prefect-worker:latest
    container_name: ec-project-prefect-worker
    volumes:
      - ./flows:/flows
      - ./data_pipeline:/data_pipeline
    environment:
      - PREFECT_API_URL=http://ec-project-prefect-server:4200/api
      - POSTGRES_HOST=ec-project-postgres
      - POSTGRES_PORT=5432
      - MONGO_HOST=ec-project-mongo
      - MONGO_PORT=27017
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: ["bash","-lc","prefect work-pool create local-pool --type process || true; prefect worker start --pool local-pool --name local-worker"]
    depends_on:
      ec-project-prefect-server:
        condition: service_healthy

volumes:
  ec_project_pgdata:
  ec_project_mongodata:
  ec_project_chromadata:
  ec_project_ollamadata: