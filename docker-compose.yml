services:
  ec-project-app:
    build: .
    container_name: ec-project-app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload
    environment:
      - ENV=dev

      # Postgres (SQL)
      - POSTGRES_HOST=ec-project-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ec_project
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

      # Mongo (NoSQL)
      - MONGO_HOST=ec-project-mongo
      - MONGO_PORT=27017
      - MONGO_DB=ec_project

      # Chroma (Vector DB)
      - CHROMA_HOST=ec-project-chroma
      - CHROMA_PORT=8000

      # Ollama (Embeddings)
      - OLLAMA_HOST=http://ec-project-ollama:11434

    depends_on:
      ec-project-postgres:
        condition: service_healthy
      ec-project-mongo:
        condition: service_started
      ec-project-chroma:
        condition: service_started
      ec-project-ollama:
        condition: service_started

  ec-project-postgres:
    image: postgres:16-alpine
    container_name: ec-project-postgres
    environment:
      - POSTGRES_DB=ec_project
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ec_project_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ec_project -d ec_project"]
      interval: 5s
      timeout: 3s
      retries: 20

  ec-project-mongo:
    image: mongo:7
    container_name: ec-project-mongo
    ports:
      - "27017:27017"
    volumes:
      - ec_project_mongodata:/data/db

  ec-project-chroma:
    image: chromadb/chroma:latest
    container_name: ec-project-chroma
    ports:
      - "8000:8000"
    volumes:
      - ec_project_chromadata:/chroma/chroma

  ec-project-ollama:
    image: ollama/ollama:latest
    container_name: ec-project-ollama
    ports:
      - "11434:11434"
    volumes:
      - ec_project_ollamadata:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

volumes:
  ec_project_pgdata:
  ec_project_mongodata:
  ec_project_chromadata:
  ec_project_ollamadata:
