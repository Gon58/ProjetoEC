services:
  ec-project-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ec-project-backend
    volumes:
      - ./backend:/app/backend
    ports:
      - "8080:8080"
    environment:
      - ENV=dev
      - POSTGRES_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@ec-project-postgres:5432/ec_project
      - MONGO_HOST=ec-project-mongo
      - MONGO_PORT=27017
      - MONGO_DB=ec_project
      - CHROMA_HOST=ec-project-chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ec-project-ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - SESSION_SECRET=${SESSION_SECRET}
      - STEAM_API_KEY=${STEAM_API_KEY}
    depends_on:
      ec-project-postgres:
        condition: service_healthy
      ec-project-mongo:
        condition: service_started
      ec-project-chroma:
        condition: service_started
      ec-project-ollama:
        condition: service_started

  ec-project-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ec-project-frontend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - ec-project-backend

  ec-project-postgres:
    image: postgres:16-alpine
    container_name: ec-project-postgres
    environment:
      - POSTGRES_DB=ec_project
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ec_project_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ec_project"]
      interval: 5s
      timeout: 3s
      retries: 20

  ec-project-mongo:
    image: mongo:7
    container_name: ec-project-mongo
    ports:
      - "27017:27017"
    volumes:
      - ec_project_mongodata:/data/db

  ec-project-chroma:
    image: chromadb/chroma:latest
    container_name: ec-project-chroma
    ports:
      - "8000:8000"
    volumes:
      - ec_project_chromadata:/chroma/chroma

  ec-project-ollama:
    image: ollama/ollama:latest
    container_name: ec-project-ollama
    ports:
      - "11434:11434"
    volumes:
      - ec_project_ollamadata:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  ec-project-tests:
    build:
      context: .
      dockerfile: data_pipeline/Dockerfile
    container_name: ec-project-tests
    volumes:
      - ./data_pipeline:/app/data_pipeline
    depends_on:
      ec-project-postgres:
        condition: service_healthy
      ec-project-mongo:
        condition: service_started
      ec-project-chroma:
        condition: service_started
    environment:
      - POSTGRES_URL=postgresql://${DB_USER}:${DB_PASSWORD}@ec-project-postgres:5432/ec_project
      - MONGO_HOST=ec-project-mongo
      - MONGO_PORT=27017
      - MONGO_DB=ec_project
      - CHROMA_HOST=ec-project-chroma
      - CHROMA_PORT=8000

  ec-project-backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: ec-project-backend-tests
    volumes:
      - ./backend:/app/backend
    depends_on:
      ec-project-postgres:
        condition: service_healthy
      ec-project-mongo:
        condition: service_started
      ec-project-chroma:
        condition: service_started
      ec-project-ollama:
        condition: service_started
    environment:
      - POSTGRES_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@ec-project-postgres:5432/ec_project
      - MONGO_HOST=ec-project-mongo
      - MONGO_PORT=27017
      - MONGO_DB=ec_project
      - CHROMA_HOST=ec-project-chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ec-project-ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
    tty: true

volumes:
  ec_project_pgdata:
  ec_project_mongodata:
  ec_project_chromadata:
  ec_project_ollamadata: