[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Backend API for EC project"
authors = [{ name = "EC-Project" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "psycopg[binary]",
    "sqlalchemy",
    "pymongo",
    "chromadb",
    "ollama",
    "pydantic",
    "pyyaml",
    "httpx",
    "itsdangerous"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]